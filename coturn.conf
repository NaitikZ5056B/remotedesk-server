# coturn TURN server configuration
# Install: sudo apt install coturn
# Enable: edit /etc/default/coturn, set TURNSERVER_ENABLED=1
# Copy this to: /etc/turnserver.conf

# Network
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Authentication (use long-term credentials with shared secret for dynamic users)
use-auth-secret
static-auth-secret=CHANGE_THIS_TO_A_RANDOM_SECRET

# Realm
realm=remotedesk.example.com

# TLS (generate with: certbot certonly --standalone -d your-domain.com)
# cert=/etc/letsencrypt/live/your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/your-domain.com/privkey.pem

# Security
no-multicast-peers
no-cli
stale-nonce=600
max-bps=0
total-quota=0
user-quota=0

# Logging
log-file=/var/log/turnserver.log
simple-log
verbose

# Performance
proc-quota=50
max-allocate-timeout=60
